<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Stage 1 caveat · Batch with a shared left operand</title>
  <desc id="diagram-description">Three separate 64 by 256 column-major right blocks are consumed transposed. Three coupling GEMMs reuse the same 128 by 256 left panel. This particular block layout prevents ordinary column fusion; it is not forced by a TLR transpose flag.</desc>
  <rect x="1" y="1" width="1198" height="648" rx="18" fill="#ffffff" stroke="#dce4ed" stroke-width="2" />
  <text x="48" y="55" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="start">Stage 1 caveat · Batch with a shared left operand</text>
  <text x="48" y="98" fill="#42556b" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">If the right factors are stored as consecutive transposed blocks Rⱼ = Wₖⱼᵀ.</text>
  <text x="600" y="145" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="middle">Sₖ,ⱼ = Aₖ Rⱼᵀ     with     Aₖ = [V₁ₖᵀ; V₂ₖᵀ]</text>
  <text x="202.5" y="227" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">One shared left panel</text>
  <text x="202.5" y="259" fill="#42556b" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">128 × 256</text>
  <rect x="60" y="276" width="285" height="144" rx="0" fill="#dbeafe" stroke="#60a5fa" stroke-width="2.5" />
  <line x1="60" y1="348.0" x2="345" y2="348.0" stroke="#60a5fa" stroke-width="2" />
  <text x="202.5" y="320.0" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">V₁ₖᵀ</text>
  <text x="202.5" y="392.0" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">V₂ₖᵀ</text>
  <text x="398" y="270" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="normal" text-anchor="middle">×</text>
  <rect x="440" y="228" width="255" height="70" rx="0" fill="#ffedd5" stroke="#fb923c" stroke-width="2" />
  <text x="567" y="273" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">R₁ᵀ : 256 × 64</text>
  <text x="735" y="271" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="normal" text-anchor="middle">=</text>
  <rect x="778" y="228" width="320" height="70" rx="0" fill="#dcfce7" stroke="#4ade80" stroke-width="2" />
  <text x="938" y="272" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">[S₁ₖ₁; S₂ₖ₁] : 128 × 64</text>
  <text x="398" y="378" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="normal" text-anchor="middle">×</text>
  <rect x="440" y="336" width="255" height="70" rx="0" fill="#ffedd5" stroke="#fb923c" stroke-width="2" />
  <text x="567" y="381" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">R₂ᵀ : 256 × 64</text>
  <text x="735" y="379" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="normal" text-anchor="middle">=</text>
  <rect x="778" y="336" width="320" height="70" rx="0" fill="#dcfce7" stroke="#4ade80" stroke-width="2" />
  <text x="938" y="380" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">[S₁ₖ₂; S₂ₖ₂] : 128 × 64</text>
  <text x="398" y="486" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="normal" text-anchor="middle">×</text>
  <rect x="440" y="444" width="255" height="70" rx="0" fill="#ffedd5" stroke="#fb923c" stroke-width="2" />
  <text x="567" y="489" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">R₃ᵀ : 256 × 64</text>
  <text x="735" y="487" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="normal" text-anchor="middle">=</text>
  <rect x="778" y="444" width="320" height="70" rx="0" fill="#dcfce7" stroke="#4ade80" stroke-width="2" />
  <text x="938" y="488" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">[S₁ₖ₃; S₂ₖ₃] : 128 × 64</text>
  <rect x="48.0" y="552" width="356.0" height="66" rx="10" fill="#f4f7fb" stroke="#dce4ed" stroke-width="0" />
  <text x="226.0" y="579" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="middle">1 wide GEMM → 3 tasks</text>
  <text x="226.0" y="605" fill="#42556b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle">same arithmetic; different grouping</text>
  <rect x="422.0" y="552" width="356.0" height="66" rx="10" fill="#f4f7fb" stroke="#dce4ed" stroke-width="0" />
  <text x="600.0" y="579" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Right layout: (n, j):(1, NK)</text>
  <text x="600.0" y="605" fill="#42556b" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle">column fusion blocked by strides</text>
  <rect x="796.0" y="552" width="356.0" height="66" rx="10" fill="#f4f7fb" stroke="#dce4ed" stroke-width="0" />
  <text x="974.0" y="579" fill="#172b42" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Same left operand pointer</text>
  <text x="974.0" y="605" fill="#42556b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle">reuse can help preserve throughput</text>
  <text x="48" y="640" fill="#42556b" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Schematic blocks; numerical matrix dimensions are shown above each panel.</text>
</svg>